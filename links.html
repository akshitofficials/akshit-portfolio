<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Akshit | Portfolio & GitHub</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#0b1220,#16243d);color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:24px}
    main{width:min(100%,420px);padding:40px 30px;text-align:center;background:#ffffff0d;border:1px solid #ffffff25;border-radius:24px;box-shadow:0 20px 55px #0005}
    .avatar{display:grid;place-items:center;width:70px;height:70px;margin:auto;border-radius:20px;background:#3b82f6;color:white;font-size:28px;font-weight:800}
    h1{font-size:28px;margin:20px 0 6px}p{color:#cbd5e1;margin:0 0 30px;line-height:1.6}
    a{display:block;text-decoration:none;padding:16px;border-radius:12px;font-weight:700;margin-top:14px;transition:transform .15s,background .15s}a:hover{transform:translateY(-2px)}
    .portfolio{background:#60a5fa;color:#071528}.github{border:1px solid #94a3b8;color:#fff;background:#ffffff10}
    small{display:block;color:#94a3b8;margin-top:26px}
  </style>
</head>
<body><main>
  <div class="avatar">AA</div>
  <h1>Akshit Aggarwal</h1>
  <p>Explore my projects, portfolio and code.</p>
  <a class="portfolio" href="https://akshitofficials.github.io/akshit-portfolio/">🌐 View Portfolio</a>
  <a class="github" href="https://github.com/akshitofficials">⌘ View GitHub Profile</a>
  <small>Thanks for visiting!</small>
</main></body></html>
